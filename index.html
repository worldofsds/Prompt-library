<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17251f"><title>Prompt Library</title>
<style>
:root{--bg:#f3f6f2;--paper:#fff;--ink:#18251e;--muted:#68756d;--line:#e1e8e1;--green:#426b54;--pale:#e5eee6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(120deg,#17251f,#345b45);color:#fff;padding:30px 18px} .wrap{max-width:1050px;margin:auto}
h1{font-size:clamp(29px,5vw,42px);margin:0 0 6px;letter-spacing:-1px}header p{margin:0;color:#d4e0d6}
nav{display:flex;justify-content:flex-end;margin-top:16px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#fff;text-decoration:none;font:650 14px system-ui;cursor:pointer}
.btn.light,button.secondary{background:var(--pale);color:#254632}
main{max-width:1050px;margin:23px auto;padding:0 16px 40px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}input{flex:1;min-width:190px}select{min-width:155px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;flex-direction:column;min-height:220px;box-shadow:0 5px 18px #18251e08}
.top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}h2{font-size:18px;line-height:1.3;margin:0 0 7px}
.tag{font-size:11px;font-weight:700;color:#355a43;background:var(--pale);padding:5px 9px;border-radius:30px;white-space:nowrap}
.desc,.muted{font-size:13px;color:var(--muted)}.prompt{background:#f7f9f6;border:1px solid #edf1ec;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;margin:10px 0 13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:12px;padding:8px 11px}
.empty{grid-column:1/-1;text-align:center;padding:36px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}
#count{font-size:13px;color:var(--muted)}footer{max-width:1050px;margin:auto;padding:0 16px 25px;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17251f;color:#fff;padding:10px 15px;border-radius:10px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:560px){header{padding:24px 16px}.tools{display:grid;grid-template-columns:1fr}input,select{width:100%;min-width:0}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Prompt Library ✦</h1><p>Discover, read and copy prompts for your next idea.</p><nav><a class="btn light" id="ownerLink" target="_blank" rel="noopener">Owner: Manage prompts on GitHub ↗</a></nav></div></header>
<main>
<div class="tools"><input id="search" type="search" placeholder="Search prompts..." aria-label="Search prompts"><select id="filter"><option value="All">All categories</option></select></div>
<p id="count">Loading prompts…</p><section class="grid" id="cards"></section>
</main>
<footer>Visitors can read and copy prompts. Adding, editing and deleting are managed through the owner's GitHub repository.</footer>
<div class="toast" id="toast">Copied!</div>
<script src="./config.js"></script>
<script>
const cfg=window.PROMPT_LIBRARY_CONFIG||{};
const repo=cfg.repository||'YOUR_GITHUB_USERNAME/YOUR_REPOSITORY';
const branch=cfg.branch||'main';
const dataUrl=`https://raw.githubusercontent.com/${repo}/${branch}/prompts.json`;
const editUrl=`https://github.com/${repo}/edit/${branch}/prompts.json`;
document.getElementById('ownerLink').href=editUrl;
let prompts=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function render(){
 const q=$('search').value.trim().toLowerCase(),cat=$('filter').value;
 const found=prompts.filter(p=>(cat==='All'||p.category===cat)&&`${p.title} ${p.description||''} ${p.prompt} ${p.category}`.toLowerCase().includes(q));
 $('count').textContent=`Showing ${found.length} of ${prompts.length} prompts`;
 $('cards').innerHTML=found.length?found.map((p,i)=>`<article class="card"><div class="top"><h2>${esc(p.title)}</h2><span class="tag">${esc(p.category||'Other')}</span></div>${p.description?`<p class="desc">${esc(p.description)}</p>`:''}<pre class="prompt" id="p${i}">${esc(p.prompt)}</pre><div class="actions"><button data-copy="${i}">Copy prompt</button><button class="secondary" data-expand="${i}">Read full</button></div></article>`).join(''):'<div class="empty">No prompts found. Try a different search.</div>';
}
$('cards').addEventListener('click',async e=>{
 const c=e.target.closest('[data-copy]'),x=e.target.closest('[data-expand]');
 if(c){try{await navigator.clipboard.writeText(prompts[Number(c.dataset.copy)].prompt);toast('Prompt copied!')}catch{toast('Copy unavailable in this browser')}}
 if(x){const el=$('p'+x.dataset.expand);el.style.maxHeight=el.style.maxHeight==='none'?'180px':'none';x.textContent=el.style.maxHeight==='none'?'Show less':'Read full'}
});
$('search').oninput=render;$('filter').onchange=render;
async function load(){
 try{
  if(repo.includes('YOUR_'))throw Error('Owner must configure config.js');
  const r=await fetch(dataUrl+'?v='+Date.now());if(!r.ok)throw Error('Could not fetch prompts.json');
  const d=await r.json();if(!Array.isArray(d))throw Error('prompts.json must contain a JSON array');
  prompts=d.filter(p=>p&&p.title&&p.prompt);
  [...new Set(prompts.map(p=>p.category||'Other'))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('filter').append(o)});
  render();
 }catch(e){$('count').textContent='Prompt library setup needed';$('cards').innerHTML=`<div class="empty">${esc(e.message)}. Please check the repository settings and try again.</div>`}
}
load();
</script>
</body></html>
